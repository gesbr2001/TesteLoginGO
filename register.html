<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Novo Utilizador</h2>
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="Escolha um utilizador" required>
            <input type="password" name="password" placeholder="Escolha uma senha" required>
            <button type="submit" style="background-color: #28a745;">Registar</button>
        </form>

        <p style="margin-top: 15px;">
            <a href="login.html">Voltar ao Login</a>
        </p>
    </div>
</body>
</html>
